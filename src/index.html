<!DOCTYPE html>
  <html>
    <body>
      <button id="jumpButton">JUMP</button>
      <style>
        body {
          background-color:black;
        }
        h1 {
          color: white;
        }
        button {
          position: absolute;
          top: 600px;
          right: 100px;
          font-size: 50px;
        }
      </style>
    <h1>Shapes Sprint</h1>
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    <script>
      var canvas = document.getElementById("gameCanvas");
      var ctx = canvas.getContext("2d");
      var isJumping = false;
      var recty = 300;
      var speedrecty = 70;
      var enemyrectx = 900;
      var speedenemyrect = 5;
      var num = Math.floor(Math.random()*3001);
      //draws a red square
      function draw(){
        ctx.fillStyle = "red";
        ctx.fillRect(10, recty, 50, 50);
        //draws a line
        ctx.beginPath();
        ctx.moveTo(0,355);
        ctx.lineTo(1000,355);
        ctx.lineWidth = 10;
        ctx.strokeStyle = "white";
        ctx.stroke();
        //draws enemy rectangle
        ctx.fillStyle = "blue";
        ctx.fillRect(enemyrectx,320,40,30);
        
      }
      draw()
      //animating enemy rectangle
      setInterval (funtion(){
        ctx.clearRect(enemyrectx,320,canvas.width,canvas,height);
        enemyrectx -= speedenemyrect;
        draw();
      }, 1000/60);
      //button functionality
      jumpButton.addEventListener("click", (event) => {
        if (!isJumping) {
          ctx.clearRect(10,recty, 50, 50);
          isJumping = true;
          recty -= speedrecty;
          draw();
        }
        setTimeout(function() {
          ctx.clearRect(10,recty, 50, 50);
          isJumping = false;
          recty += speedrecty;
          draw();
        }, 1000);
      })
    </script>
  </body>
  </html>
